<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汞分子的旅程 Hg Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one screen. Aquarium animation on top; info panel below (three columns when wide, stacked when narrow). Single light look. */
:root{
  --bg:#f3f8f7;
  --paper:#ffffff;
  --ink:#1d3540;
  --muted:#62797f;
  --line:#d4e4e1;
  --accent:#e08a2a;
  --hg:#d23a54;
  --plank:#6fb88a;
  --small:#f2b544;
  --mid:#5f9cc0;
  --big:#2f5f86;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.tank{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#dff1ef;min-height:0;min-width:0}
canvas{display:block;width:100%;height:100%}
.timer{position:absolute;top:10px;left:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;pointer-events:none}
.timer span{font:600 1.35rem var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.timer small{font-size:.85rem;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:grid;gap:12px;min-width:0;max-height:46vh;overflow:auto}
.panel>div{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:760px){.panel{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(180px,.55fr);align-items:stretch;gap:18px}}
h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.3;margin:0}
p{margin:0;max-width:56ch}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.chain span{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg)}
.chain i{display:inline-block;border-radius:50%}
.chain .arr{color:var(--muted);font-weight:500;border:none;background:none;padding:0}
.rule{display:flex;gap:10px;align-items:flex-start;background:#fdecef;border-radius:12px;padding:10px 14px}
.rule b{color:var(--hg)}
.hgdot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--hg);margin-top:5px}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.c{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.c .k{font-size:.8rem;color:var(--muted)}
.c .v{font:600 1.6rem var(--f-num);color:var(--hg);font-variant-numeric:tabular-nums}
.k-title{font-weight:700;font-size:.92rem}
.end{background:#e8f5ee;border-radius:12px;padding:10px 14px}
.panel>.actions{flex-direction:row;justify-content:flex-end}
@media (min-width:760px){.panel>.actions{flex-direction:column}.actions .btn{flex:1}}
.btn{font:700 1.15rem var(--f-body);border-radius:14px;min-height:56px;padding:10px 20px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible{outline:3px solid #3b82c4;outline-offset:2px}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.35rem}.c .v{font-size:1.3rem}}
</style>
</head>
<body>
<div class="app">
  <section class="tank" id="tank" aria-label="魚缸模擬"><canvas id="cv"></canvas><div class="timer"><small>經過時間</small><span id="clock">00:00</span></div></section>
  <section class="panel">
    <div>
    <h1>汞分子的旅程</h1>
    <div class="chain"><span><i style="width:8px;height:8px;background:var(--hg)"></i>水中的汞</span><span class="arr">被吃 →</span><span><i style="width:10px;height:10px;background:var(--plank)"></i>浮游生物</span><span class="arr">被吃 →</span><span><i style="width:12px;height:12px;background:var(--small)"></i>小魚</span><span class="arr">被吃 →</span><span><i style="width:14px;height:14px;background:var(--mid)"></i>中魚</span><span class="arr">被吃 →</span><span><i style="width:16px;height:16px;background:var(--big)"></i>大魚</span></div>
    <div class="rule"><i class="hgdot"></i><p>汞原本散在<b>水中</b>。浮游生物吸收水中的汞，身上就多 1 個汞（最多 2 個）。生物被吃掉時，牠身上的汞<b>全部留在吃牠的魚身上</b>，排不出去。</p></div>
    </div>
    <div>
    <div class="k-title">每條平均有幾個汞</div>
    <div class="counts">
      <div class="c"><div class="k">浮游生物</div><div class="v" id="cT">0.0</div></div>
      <div class="c"><div class="k">小魚</div><div class="v" id="cS">0.0</div></div>
      <div class="c"><div class="k">中魚</div><div class="v" id="cM">0.0</div></div>
      <div class="c"><div class="k">大魚</div><div class="v" id="cB">0.0</div></div>
    </div>
    <div class="end" id="end" hidden>大魚身上的汞最多！越上層的魚，汞累積越多，這就是<b>生物放大作用</b>。</div>
    <p class="note">魚頭上的數字＝這條魚身上有幾個汞；上方格子＝每條平均有幾個汞。遊戲 30 秒時會自動暫停。教學示意，真實倍率會因物種而不同。</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="play" type="button">開始</button>
      <button class="btn" id="reset" type="button">重來</button>
    </div>
  </section>
</div>

<script>
(function(){
const COL={plank:'#6fb88a',small:'#f2b544',mid:'#5f9cc0',big:'#2f5f86',hg:'#d23a54',ink:'#1d3540'};
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,K=1,T=0,running=false,fish=[],pops=[],queue=[],water=[],shown=false;
const WATER_N=50;
function makeHg(){return{x:rnd(.04,.96)*W,y:rnd(.1,.95)*H,ph:rnd(0,6),s:3*K,alive:true};}
const rnd=(a,b)=>a+Math.random()*(b-a);
const SPEC={
  plank:{size:7,speed:30,n:40,respawn:.8,eats:'water',rest:.5},
  small:{size:14,speed:55,n:14,respawn:2,eats:'plank',rest:1.6,range:.35},
  mid:{size:23,speed:68,n:7,respawn:2.5,eats:'small',rest:1.2,range:.5},
  big:{size:44,speed:92,n:2,eats:'mid',rest:1.0,range:3}
};

function resize(){
  const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  const oW=W,oH=H;W=r.width;H=r.height;K=Math.max(.6,Math.min(1.3,Math.min(W,H)/520));
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
  if(oW<50||oH<50){if(W>=50&&H>=50)spread();}
  else{for(const f of fish){f.x*=W/oW;f.y*=H/oH;f.s=SPEC[f.kind].size*K;}for(const w of water){w.x*=W/oW;w.y*=H/oH;w.s=3*K;}}
  if(!running)draw();
}
new ResizeObserver(resize).observe(document.getElementById('tank'));

function make(kind,edge){
  const sp=SPEC[kind],a=rnd(0,Math.PI*2);
  let x=rnd(.1,.9)*W,y=rnd(.15,.9)*H;
  if(edge){const left=Math.random()<.5;x=left?-20:W+20;}
  const f={kind,x,y,vx:Math.cos(a)*sp.speed*K,vy:Math.sin(a)*sp.speed*K*.5,s:sp.size*K,dots:[],rest:rnd(0,1),wob:rnd(0,6),alive:true};
  return f;
}
function addDots(f,n){
  for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),r=Math.sqrt(Math.random());f.dots.push([Math.cos(a)*r*.62,Math.sin(a)*r*.24]);}
}
function cells(n){
  const cols=Math.max(1,Math.round(Math.sqrt(n*W/H))),rows=Math.ceil(n/cols),out=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out.push([c,r]);
  out.sort(()=>Math.random()-.5);
  const x0=W*.06,x1=W*.94,y0=H*.14,y1=H*.9;
  return out.slice(0,n).map(([c,r])=>[x0+(c+rnd(.15,.85))/cols*(x1-x0),y0+(r+rnd(.15,.85))/rows*(y1-y0)]);
}
function spread(){
  if(W<50||H<50)return;
  const alive=fish.filter(f=>f.alive),pos=cells(alive.length);
  alive.forEach((f,i)=>{f.x=pos[i][0];f.y=pos[i][1];f.s=SPEC[f.kind].size*K;});
  const wp=cells(water.length);water.forEach((w,i)=>{w.x=wp[i][0];w.y=wp[i][1];w.s=3*K;});
  if(!running)draw();
}
function reset(){
  fish=[];pops=[];queue=[];T=0;shown=false;
  water=Array.from({length:WATER_N},makeHg);
  for(const k of ['plank','small','mid','big'])for(let i=0;i<SPEC[k].n;i++)fish.push(make(k));
  spread();
  document.getElementById('end').hidden=true;update();draw();
}

function step(dt){
  T+=dt;
  for(const f of fish){
    if(!f.alive)continue;
    const sp=SPEC[f.kind];f.rest-=dt;
    let target=null;
    if(sp.eats&&f.rest<=0&&!(sp.eats==='water'&&f.dots.length>=2)){
      let bd=1e9;const pool=sp.eats==='water'?water:fish;for(const p of pool){if(!p.alive||(pool===fish&&p.kind!==sp.eats))continue;const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<bd){bd=d;target=p;}}
      if(bd>Math.min(W,H)*(sp.range||.6))target=null;
    }
    const max=sp.speed*K*(target?1.25:1);
    if(target){
      const dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1;
      f.vx+=(dx/d*max-f.vx)*dt*2.5;f.vy+=(dy/d*max-f.vy)*dt*2.5;
      const dir=f.vx>=0?1:-1,mx=f.x+dir*f.s*.85,my=f.y;
      if(Math.hypot(target.x-mx,target.y-my)<target.s*.8+f.s*.35){
        target.alive=false;f.rest=sp.rest;
        if(sp.eats==='water'){addDots(f,1);}
        else{addDots(f,target.dots.length);if(target.dots.length)pops.push({x:f.x,y:f.y-f.s*.7,t:0,n:target.dots.length});queue.push({kind:target.kind,at:T+SPEC[target.kind].respawn});}
      }
    }else{
      const a=Math.atan2(f.vy,f.vx)+rnd(-1,1)*dt*1.5;
      f.vx+=(Math.cos(a)*max-f.vx)*dt;f.vy+=(Math.sin(a)*max*.6-f.vy)*dt;
    }
    // flee for prey
    if(f.kind!=='big'){
      for(const p of fish){if(!p.alive||SPEC[p.kind].eats!==f.kind)continue;const dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy);
        if(d<p.s*3){f.vx+=dx/d*sp.speed*K*dt*1.2;f.vy+=dy/d*sp.speed*K*dt*1.2;}}
      const v=Math.hypot(f.vx,f.vy),cap=sp.speed*K*1.3;if(v>cap){f.vx*=cap/v;f.vy*=cap/v;}
    }
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    const m=f.s*1.2;
    if(f.x<m){f.vx=Math.abs(f.vx);}if(f.x>W-m){f.vx=-Math.abs(f.vx);}
    if(f.y<m+H*.06){f.vy=Math.abs(f.vy);}if(f.y>H-m){f.vy=-Math.abs(f.vy);}
  }
  fish=fish.filter(f=>f.alive);
  water=water.filter(w=>w.alive);
  if(water.length<WATER_N&&Math.random()<dt*3)water.push(makeHg());
  for(const w of water){w.x+=Math.sin(T*.6+w.ph)*dt*6;w.y+=Math.cos(T*.5+w.ph)*dt*4;}
  for(let i=queue.length-1;i>=0;i--)if(queue[i].at<=T){
    // newcomers swim in from the same polluted sea, so they arrive carrying their level's average
    const k=queue[i].kind,same=fish.filter(f=>f.alive&&f.kind===k),nf=make(k,true);
    if(k!=='plank'&&same.length)addDots(nf,Math.round(same.reduce((a,f)=>a+f.dots.length,0)/same.length));
    fish.push(nf);queue.splice(i,1);}
  for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<1.2);
  update();
}

function drawFish(f){
  const s=f.s,left=f.vx<0;
  if(f.kind==='plank'){
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(T*.5+f.wob);
    ctx.strokeStyle=COL.plank;ctx.lineWidth=1.5;ctx.beginPath();
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.moveTo(Math.cos(a)*s,Math.sin(a)*s);ctx.lineTo(Math.cos(a)*s*1.55,Math.sin(a)*s*1.55);}ctx.stroke();
    ctx.fillStyle='rgba(111,184,138,.55)';ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=COL.hg;f.dots.forEach((d,i)=>{ctx.beginPath();ctx.arc(i?s*.35:-s*.35,0,2.4*K,0,7);ctx.fill();});
    ctx.restore();return;
  }
  ctx.save();ctx.translate(f.x,f.y);if(left)ctx.scale(-1,1);ctx.rotate(Math.max(-.5,Math.min(.5,Math.atan2(f.vy,Math.abs(f.vx)))));
  const col=COL[f.kind],tw=Math.sin(T*8+f.wob)*.12;
  ctx.fillStyle=col;ctx.strokeStyle='rgba(29,53,64,.35)';ctx.lineWidth=Math.max(1,s*.04);
  ctx.beginPath();ctx.moveTo(-s*.78,0);ctx.lineTo(-s*1.25,-s*(.4+tw));ctx.lineTo(-s*1.1,0);ctx.lineTo(-s*1.25,s*(.4-tw));ctx.closePath();ctx.fill();
  if(f.kind==='big'){ctx.beginPath();ctx.moveTo(-s*.05,-s*.33);ctx.lineTo(-s*.4,-s*.72);ctx.lineTo(-s*.42,-s*.3);ctx.fill();}
  ctx.globalAlpha=.85;
  ctx.beginPath();ctx.moveTo(s,0);ctx.bezierCurveTo(s*.6,-s*.5,-s*.55,-s*.48,-s*.85,0);ctx.bezierCurveTo(-s*.55,s*.48,s*.6,s*.5,s,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.62,-s*.08,Math.max(1.6,s*.1),0,7);ctx.fill();
  ctx.fillStyle=COL.ink;ctx.beginPath();ctx.arc(s*.64,-s*.08,Math.max(1,s*.05),0,7);ctx.fill();
  const r={small:2.4,mid:2.9,big:3.4}[f.kind]*K;
  ctx.fillStyle=COL.hg;
  for(const [u,v] of f.dots){ctx.beginPath();ctx.arc(u*s,v*s*1.6,r,0,7);ctx.fill();}
  ctx.restore();
  if(f.dots.length){
    const fs={small:12,mid:14,big:17}[f.kind];
    const t=String(f.dots.length);ctx.font=`700 ${Math.round(fs*K)}px "IBM Plex Mono",monospace`;
    const w=ctx.measureText(t).width+12,h=(fs+7)*K,x=f.x-w/2,y=f.y-s*.75-h;
    ctx.fillStyle='#fff';ctx.strokeStyle=COL.hg;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();ctx.stroke();
    ctx.fillStyle=COL.hg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,f.x,y+h/2+1);
  }
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e6f5f3');g.addColorStop(1,'#bfe0dd');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;
  for(let i=0;i<2;i++){ctx.beginPath();for(let x=0;x<=W;x+=16)ctx.lineTo(x,H*(.035+i*.025)+Math.sin(x/38+T*1.5+i)*3);ctx.stroke();}
  ctx.fillStyle='#d9c79e';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=24)ctx.lineTo(x,H-10-Math.sin(x/70)*6);ctx.lineTo(W,H);ctx.fill();
  for(const w of water){if(!w.alive)continue;ctx.fillStyle='rgba(210,58,84,.18)';ctx.beginPath();ctx.arc(w.x,w.y,w.s*2,0,7);ctx.fill();ctx.fillStyle=COL.hg;ctx.beginPath();ctx.arc(w.x,w.y,w.s,0,7);ctx.fill();}
  const order={plank:0,small:1,mid:2,big:3};
  [...fish].filter(f=>f.alive).sort((a,b)=>order[a.kind]-order[b.kind]).forEach(drawFish);
  for(const p of pops){ctx.save();ctx.globalAlpha=1-p.t/1.2;ctx.font=`700 ${Math.round(15*K)}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';ctx.fillStyle=COL.hg;ctx.fillText(`+${p.n} 汞`,p.x,p.y-p.t*30);ctx.restore();}
}
function update(){
  const avg=k=>{const a=fish.filter(f=>f.alive&&f.kind===k);return a.length?a.reduce((x,f)=>x+f.dots.length,0)/a.length:0;};
  const fmt=v=>v<10?v.toFixed(1):String(Math.round(v));
  const t=avg('plank'),s=avg('small'),m=avg('mid'),b=avg('big');
  const sec=Math.floor(T);document.getElementById('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  document.getElementById('cT').textContent=fmt(t);document.getElementById('cS').textContent=fmt(s);document.getElementById('cM').textContent=fmt(m);document.getElementById('cB').textContent=fmt(b);
  if(!shown&&T>=30){
    shown=true;running=false;document.getElementById('play').textContent='繼續';
    const e=document.getElementById('end');
    e.innerHTML=`30 秒到了！大魚平均有 <b>${Math.round(b)}</b> 個汞，${s>0?`大約是小魚的 <b>${Math.max(1,Math.round(b/s))}</b> 倍。`:''}越上層的生物，汞累積越多，這就是<b>生物放大作用</b>。`;
    e.hidden=false;
  }
}

let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running&&W){step(dt*(REDUCE?1:1));draw();}
  requestAnimationFrame(loop);})(last);

const play=document.getElementById('play');
play.onclick=()=>{if(!running&&T===0)spread();running=!running;play.textContent=running?'暫停':'繼續';};
document.getElementById('reset').onclick=()=>{running=false;play.textContent='開始';reset();};

resize();reset();
})();
</script>
</body>
</html>
